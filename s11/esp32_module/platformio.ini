; S11 — Ganglion external neural module on ESP32-S3
; Transport: USB CDC via TinyUSB (USB_MODE=0) or WiFi TCP (set in src/main.cpp)
; NOTE: USB-Serial/JTAG (hardware CDC, USB_MODE=1) drops bytes under
; sustained 16KB/frame streams (HWCDC RX ringbuffer overflow) — measured
; 4096/16388 B received. TinyUSB CDC has proper flow control.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
